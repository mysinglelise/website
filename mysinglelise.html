<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My single lise – Lise Chemla</title>
<meta name="description" content="My single lise : électro-pop féministe. Concerts, actus, boucles.">
<link rel="icon" href="assets/poster.png">
<link rel="stylesheet" href="style.css">
<style>
/* Cette page a son propre style : tout est ici. */
@font-face{font-family:Bricolage;src:url(assets/fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:Syne;src:url(assets/fonts/syne-latin-800-normal.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Instrument Serif";src:url(assets/fonts/instrument-serif-latin-400-italic.woff2) format("woff2");font-style:italic;font-display:swap}
:root{--b0:0;--b1:0;--b2:0;--b3:0;--blow:0}
body.msl{overflow-x:hidden}
.msl main{position:relative;z-index:1;max-width:none;width:100%;margin:0;padding:0}
.msl .top{position:relative;z-index:5}

.sound{position:fixed;top:.9rem;right:clamp(.8rem,3vw,2rem);z-index:20;display:flex;gap:.45rem;flex-wrap:wrap;justify-content:flex-end}
.sound button{font:600 .8rem/1 "Instrument Sans",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:#fff;
  border:2px solid var(--ink);border-radius:99px;padding:.55rem .9rem;cursor:pointer;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.sound button:hover{transform:rotate(-3deg) scale(1.06)}
.sound button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.sound button[hidden]{display:none}

/* ----- le désordre ----- */
.board{position:relative;width:100%;overflow:hidden}
/* logo : toujours en haut à gauche, rouge barré, comme dans le menu */
.board .word{position:absolute;left:clamp(1rem,5vw,4rem);top:clamp(.5rem,3vw,2rem);z-index:30;font-size:clamp(3rem,13vw,10rem)}
.board .tag{position:absolute;left:clamp(1rem,5vw,4rem);z-index:30;color:var(--red);font-family:"Instrument Serif",serif;font-style:italic;font-size:clamp(1.3rem,2.4vw,2rem);max-width:30ch}
.item{position:absolute;mix-blend-mode:multiply;transform:rotate(calc(var(--r,0deg) + var(--bx,var(--b0))*3deg)) scale(calc(1 + var(--bx,var(--b0))*.12));
  transition:filter .2s;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.item.med{opacity:calc(1 - var(--blow))}
.item.band0{--bx:var(--b0)}.item.band1{--bx:var(--b1)}.item.band2{--bx:var(--b2)}.item.band3{--bx:var(--b3)}
.item:hover{z-index:50!important}
.item.drag{cursor:grabbing;z-index:60!important}
.item img,.item video{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
.item.gen{aspect-ratio:1;border-radius:50%;background:conic-gradient(from var(--a,0deg),#fff,var(--red),#fff);animation:spin 5s linear infinite}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}

.q{font-family:Bricolage,"Instrument Sans",sans-serif;font-weight:800;text-transform:uppercase;line-height:.92;color:var(--red);letter-spacing:-.02em}
.q.syne{font-family:Syne,sans-serif;letter-spacing:-.04em;line-height:.95}
.q.serif{font-family:"Instrument Serif",serif;font-weight:400;font-style:italic;text-transform:none;letter-spacing:-.01em;line-height:1}
.q.out{color:transparent;-webkit-text-stroke:2px var(--red)}
.q.inv{rotate:180deg}.q.mir{scale:-1 1}.q.vert{writing-mode:vertical-rl}
.q.bar{text-decoration:line-through;text-decoration-thickness:.07em}

/* ----- dates / actus ----- */
.below{padding:clamp(2rem,6vw,4rem) clamp(1rem,5vw,4rem) 5rem;background:#fff;position:relative;z-index:2}
.below h2{font-family:Anton,Impact,sans-serif;text-transform:uppercase;font-weight:400;font-size:clamp(2.2rem,6vw,4rem);line-height:1;color:var(--red);margin:2.5rem 0 1rem}
.rows{list-style:none;border-top:2px solid var(--ink);max-width:62rem}
.rows li{border-bottom:2px solid var(--ink)}
.rows a,.rows .r{display:grid;grid-template-columns:8rem 1fr auto;gap:.2rem 1.5rem;align-items:baseline;padding:1rem .25rem;text-decoration:none;color:var(--ink);transition:padding .2s,color .2s}
.rows a:hover{color:var(--red);padding-left:1rem}
.rows .dt{font-family:Anton,Impact,sans-serif;text-transform:uppercase;font-size:1.4rem;color:var(--red)}
.rows .ti{font-weight:600;font-size:clamp(1.15rem,2.2vw,1.5rem);line-height:1.2}
.rows .ti small{display:block;font-weight:400;font-size:1rem;color:var(--mute);margin-top:.15rem}
.rows .go{font-weight:600;text-transform:uppercase;font-size:.8rem;letter-spacing:.08em}
@media(max-width:640px){.rows a,.rows .r{grid-template-columns:1fr auto}.rows .dt{grid-column:1/-1}}
.soon{color:var(--mute);max-width:46ch}
.epk{display:inline-block;margin-top:2.5rem;background:var(--red);color:#fff;text-decoration:none;font-family:Anton,Impact,sans-serif;text-transform:uppercase;
  font-size:clamp(1.4rem,3vw,2rem);padding:.8rem 1.6rem;border-radius:99px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.epk:hover{transform:rotate(-2deg) scale(1.04)}
@media (prefers-reduced-motion:reduce){.item.gen{animation:none}.item,.board .word{transform:rotate(var(--r,0deg))}}
</style>
</head>
<body class="msl">
<header class="top"><a href="menu.html"><img src="assets/poster.png" alt=""><span>Menu</span></a></header>
<div class="sound">
  <button id="bt-shuffle" type="button">↻ Mélanger</button>
  <button id="bt-hide" type="button" aria-pressed="false">◐ Texte</button>
  <button id="bt-track" type="button" aria-pressed="false" hidden>♪ Son</button>
  <button id="bt-mic" type="button" aria-pressed="false">● Micro</button>
</div>
<main>
<div class="board" id="board">
  <h1 class="word">My single lise</h1>
  <p class="tag" id="tag">Électro-pop féministe. Souffle dans le micro : les images s’envolent.</p>
</div>
<div class="below">
  <h2>Dates</h2>
  <ul class="rows" id="dates-l"></ul>
  <p class="soon" id="dates-e" hidden>Pas de date annoncée pour l’instant. Reviens vite.</p>
  <h2>Actus</h2>
  <ul class="rows" id="actus-l"></ul>
  <p class="soon" id="actus-e" hidden>Les prochaines nouvelles apparaîtront ici.</p>
  <a class="epk" href="https://github.com/mysinglelise/EPK" target="_blank" rel="noopener">Dossier de presse →</a>
</div>
</main>

<script>
/* ==========  À MODIFIER ICI  ==========
   CITATIONS : les phrases de tes chansons qui flottent dans le désordre (une par ligne, entre guillemets).
   DATES / ACTUS : une ligne par date ou actu ("lien" est facultatif). */
var CITATIONS=[
  "Je suis la putain de musique",
  "Pas de patron",
  "Pas de dieu le père",
  "Pas de mec, pas de mac, pas de mâle",
  "Libre comme l’air et la chanson",
  "Je ne veux que de l’amour",
  "Je ne suis pas un instrument",
  "Je ne suis pas une muse",
  "Merde, j’ai mis mon pull-over à l’envers",
  "Hors d’haleine, sous la laine",
  "Je sors fière de mon pull-over",
  "Mon pull à l’endroit",
  "Tout ce qui t’arrive c’est à toi",
  "Ça t’appartient",
  "Et tu as le droit de le dire",
  "On chantera toutes d’une seule voix",
  "Je chante pour les femmes et les enfants",
  "Viens pas faire le fanfaron",
  "Je chante pas pour les darons",
  "Tes male tears coulent dans ton martini",
  "Mon petit soldat de plomb",
  "Ce monde est un jeu de garçon",
  "Le gros connard est mort, vive la pute",
  "Ton avis sur ma vie",
  "Ton avis mec j’en ai rien à foutre",
  "Ton avis sur mon corps ne me concerne pas",
  "Ça te fait bizarre hein ?",
  "On est partout chez nous",
  "Mon pays c’est la nuit",
  "Chez nous c’est une lutte",
  "Sur terre on est des locataires",
  "On est chez soi nulle part",
  "L’intelligence c’est chez nous",
  "Le respect, c’est chez nous",
  "Lise me alone"
];
var DATES=[
  // {date:"12 déc. 2026", titre:"Nom de la salle", lieu:"Ville", lien:"https://..."},
];
var ACTUS=[
  // {date:"Oct. 2026", titre:"Nouveau clip", texte:"Une phrase.", lien:"https://..."},
];
/* Si GitHub ne répond pas, on utilise cette liste (noms des fichiers de assets/loops). */
var LOOPS=["vinyle-rouge.mp4","masque-your.mp4","coeur.mp4","pull-mohair.mp4","paillettes.mp4","rose.jpg","poing.jpg"];

/* ---------- dates & actus ---------- */
function fill(list,empty,items,isNews){
  var ul=document.getElementById(list);
  if(!items.length){document.getElementById(empty).hidden=false;return;}
  items.forEach(function(x){
    var li=document.createElement('li'),el=document.createElement(x.lien?'a':'div');
    if(x.lien){el.href=x.lien;el.target='_blank';el.rel='noopener';}else el.className='r';
    var sub=isNews?x.texte:x.lieu;
    el.innerHTML='<span class="dt"></span><span class="ti"></span><span class="go"></span>';
    el.children[0].textContent=x.date||'';el.children[1].textContent=x.titre||'';
    if(sub){var s=document.createElement('small');s.textContent=sub;el.children[1].appendChild(s);}
    if(x.lien)el.children[2].textContent=isNews?'Lire →':'Infos →';
    li.appendChild(el);ul.appendChild(li);
  });
}
fill('dates-l','dates-e',DATES,false);fill('actus-l','actus-e',ACTUS,true);

/* ---------- le désordre ---------- */
(function(){
  var board=document.getElementById('board'),tag=document.getElementById('tag');
  var seed=11,items=[],media=[],els=[];
  function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}
  function R(a,b){return a+rnd()*(b-a);}
  var io='IntersectionObserver' in window?new IntersectionObserver(function(es){es.forEach(function(e){
    if(e.isIntersecting){var p=e.target.play();if(p&&p.catch)p.catch(function(){});}else e.target.pause();});},{rootMargin:'150px'}):null;

  function mk(f){
    var d=document.createElement('div');d.className='item med';
    if(f==='gen'){d.classList.add('gen');return d;}
    var u='assets/loops/'+encodeURIComponent(f);
    if(/\.(mp4|webm|mov)$/i.test(f)){
      var v=document.createElement('video');v.src=u;v.muted=true;v.loop=true;v.playsInline=true;v.setAttribute('playsinline','');v.preload='auto';
      d.appendChild(v);if(io)io.observe(v);else v.play();
    }else{var im=new Image();im.src=u;im.alt='';im.loading='lazy';d.appendChild(im);}
    return d;
  }
  function quote(txt){
    var d=document.createElement('div'),q=document.createElement('div');d.className='item';q.className='q';q.textContent=txt;
    var kinds=['','','syne','syne','serif','serif','serif inv','out','out syne','inv','mir','vert','bar','syne inv','serif mir','serif out'];
    var k=kinds[Math.floor(rnd()*kinds.length)];k.split(' ').forEach(function(c){if(c)q.classList.add(c);});
    q.style.fontSize=R(2.4,6).toFixed(2)+'vw';
    if(innerWidth<700)q.style.fontSize=R(6,10.5).toFixed(1)+'vw';
    q.style.maxWidth=(innerWidth<700?62:26)+'vw';
    d.appendChild(q);return d;
  }
  function layout(){
    seed=Math.floor(Math.random()*1e6)||11;
    els.forEach(function(e){e.remove();});els=[];
    var W=board.clientWidth,mobile=W<700,C=mobile?2:4;
    var seq=[],qi=0,mi=0;
        // un média, puis parfois une citation, en mélangeant l'ordre
    var rep=Math.max(1,Math.ceil((mobile?6:9)/media.length));var m=[];for(var r=0;r<rep;r++)m=m.concat(media);m.sort(function(){return rnd()-.5;});
    var qs=CITATIONS.slice().sort(function(){return rnd()-.5;}).slice(0,mobile?9:15);
    for(var i=0;i<m.length+qs.length;i++){
      if(qi<qs.length&&(i%5!==1&&i%5!==3||mi>=m.length))seq.push({q:qs[qi++]});
      else if(mi<m.length)seq.push({f:m[mi++]});
    }
    var cellW=W/C,rowH=mobile?W*.62:W*.2,top0=mobile?W*.62:W*.25;
    var rows=Math.ceil(seq.length/C);
    seq.forEach(function(s,i){
      var d=s.q?quote(s.q):mk(s.f);
      var big=!s.q&&rnd()<.25,small=!s.q&&rnd()<.3;
      var w=s.q?0:W*(mobile?(big?.62:small?.28:.42):(big?.3:small?.12:.2));
      if(w)d.style.width=w+'px';
      var col=i%C,row=Math.floor(i/C);
      var x=col*cellW+R(-.15,.5)*cellW;
      var y=top0+row*rowH+R(-.35,.5)*rowH;
      if(x<0)x=R(0,.05)*W;
      d.style.left=Math.min(x,W-(w||W*.15)-4)+'px';d.style.top=y+'px';
      d.style.setProperty('--r',R(-14,14).toFixed(1)+'deg');
      d.classList.add('band'+(i%4));d.style.zIndex=Math.floor(R(1,9));
      board.appendChild(d);els.push(d);drag(d);
      var bb=board.getBoundingClientRect(),rc=d.getBoundingClientRect(),L=parseFloat(d.style.left);
      if(rc.right>bb.right-4)L-=rc.right-bb.right+8;
      if(rc.left<bb.left+4)L+=bb.left-rc.left+8;
      d.style.left=L+'px';
    });
    board.style.height=(top0+rows*rowH+rowH*.5)+'px';
    tag.style.top=(mobile?W*.3:W*.17)+'px';
  }
  function drag(d){
    var sx,sy,ox,oy,on=false;
    d.addEventListener('pointerdown',function(e){
      if(e.pointerType!=='mouse')return;
      on=true;d.classList.add('drag');sx=e.clientX;sy=e.clientY;ox=d.offsetLeft;oy=d.offsetTop;d.setPointerCapture(e.pointerId);e.preventDefault();
    });
    d.addEventListener('pointermove',function(e){if(!on)return;d.style.left=(ox+e.clientX-sx)+'px';d.style.top=(oy+e.clientY-sy)+'px';});
    function up(){on=false;d.classList.remove('drag');}
    d.addEventListener('pointerup',up);d.addEventListener('pointercancel',up);
  }
  function go(files){media=files.length?files:['gen','gen','gen','gen','gen'];layout();}
  var repo,m=location.hostname.match(/^(.+)\.github\.io$/);
  if(m){var seg=location.pathname.split('/')[1]||'';repo=m[1]+'/'+((seg&&!/\.html?$/.test(seg))?seg:location.hostname);}
  var OK=/\.(gif|mp4|webm|mov|webp|png|jpe?g)$/i;
  function fallback(){go(LOOPS.filter(function(f){return OK.test(f);}));}
  if(!repo)fallback();
  else fetch('https://api.github.com/repos/'+repo+'/contents/assets/loops').then(function(r){if(!r.ok)throw 0;return r.json();})
    .then(function(it){var fs=it.filter(function(x){return x.type==='file'&&OK.test(x.name);}).map(function(x){return x.name;});if(fs.length)go(fs);else fallback();})
    .catch(fallback);
  document.getElementById('bt-shuffle').onclick=layout;
  var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(media.length)layout();},300);});
})();

/* ---------- audio-réactivité (uniquement les images) ----------
   Sans son : un battement discret simulé. Avec le son (morceau ou micro) : vraies fréquences,
   chaque image sur une bande différente (graves → aigus).
   Avec le micro : si tu SOUFFLES dedans (bruit large, sans note), les images s'effacent pour laisser lire le texte. */
(function(){
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  var AC,an,data,src,mode='idle',audioEl,stream,root=document.documentElement,binHz=1;
  var SOUFFLE_SEUIL=0.30;   /* ← plus petit = plus sensible au souffle */
  function ensure(){
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();an=AC.createAnalyser();an.fftSize=512;an.smoothingTimeConstant=.6;
      data=new Uint8Array(an.frequencyBinCount);binHz=AC.sampleRate/an.fftSize;}
    if(AC.state==='suspended')AC.resume();
  }
  var bt=document.getElementById('bt-track'),bm=document.getElementById('bt-mic'),bh=document.getElementById('bt-hide');
  var manual=false;
  bh.onclick=function(){manual=!manual;bh.setAttribute('aria-pressed',manual);};
  addEventListener('keydown',function(e){if(e.code==='Space'&&!/button|a/i.test(e.target.tagName)){manual=true;bh.setAttribute('aria-pressed','true');e.preventDefault();}});
  addEventListener('keyup',function(e){if(e.code==='Space'){manual=false;bh.setAttribute('aria-pressed','false');}});
  function stop(){
    if(audioEl)audioEl.pause();
    if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}
    if(src){try{src.disconnect();}catch(e){}src=null;}
    mode='idle';bt.setAttribute('aria-pressed','false');bm.setAttribute('aria-pressed','false');
  }
  var TRACK='assets/audio/mysinglelise.mp3';
  fetch(TRACK,{method:'HEAD'}).then(function(r){if(r.ok)bt.hidden=false;}).catch(function(){});
  bt.onclick=function(){
    if(mode==='track'){stop();return;}
    stop();ensure();
    if(!audioEl){audioEl=new Audio(TRACK);audioEl.loop=true;audioEl._node=AC.createMediaElementSource(audioEl);}
    src=audioEl._node;src.connect(an);an.connect(AC.destination);
    audioEl.play().then(function(){mode='track';bt.setAttribute('aria-pressed','true');}).catch(function(){});
  };
  bm.onclick=function(){
    if(mode==='mic'){stop();return;}
    stop();ensure();
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){bm.hidden=true;return;}
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(s){
      stream=s;src=AC.createMediaStreamSource(s);src.connect(an);try{an.disconnect(AC.destination);}catch(e){}
      mode='mic';bm.setAttribute('aria-pressed','true');
    }).catch(function(){});
  };
  function band(lo,hi){var a=Math.max(1,Math.round(lo/binHz)),b=Math.min(data.length-1,Math.round(hi/binHz)),s=0;for(var i=a;i<=b;i++)s+=data[i];return s/(b-a+1)/255;}
  var HZ=[[30,200],[200,700],[700,2800],[2800,9000]],B=[0,0,0,0],blow=0,t0=performance.now();
  function frame(now){
    var t=(now-t0)/1000,live=mode!=='idle',k,target=0;
    if(live){
      an.getByteFrequencyData(data);
      for(k=0;k<4;k++){var v=Math.min(1,band(HZ[k][0],HZ[k][1])*(1+k*.6));B[k]+=(v-B[k])*(v>B[k]?.6:.15);}
      if(mode==='mic'){
        // souffle = beaucoup d'énergie, répartie sur tout le grave/médium sans pic (platitude élevée)
        var a=Math.round(80/binHz),b=Math.round(2000/binHz),sum=0,lg=0,n=0;
        for(var i=a;i<=b;i++){var m=data[i]+1;sum+=m;lg+=Math.log(m);n++;}
        var mean=sum/n,flat=Math.exp(lg/n)/mean,lowAvg=band(80,600);
        if(lowAvg>SOUFFLE_SEUIL&&flat>.62)target=1;
      }
    }else{
      var ph=(t*1.9)%1,kk=Math.pow(1-ph,3)*.5;
      B[0]+=(kk-B[0])*.3;
      for(k=1;k<4;k++){var tt=(t*1.9*(k+1)/2)%1;B[k]+=(Math.pow(1-tt,4)*.18*(k===2?1:.6)-B[k])*.25;}
    }
    if(manual)target=1;
    blow+=(target-blow)*(target>blow?.06:.03);
    for(k=0;k<4;k++)root.style.setProperty('--b'+k,(reduce?0:B[k]).toFixed(3));
    root.style.setProperty('--blow',blow.toFixed(3));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange',function(){if(mode==='track'){if(document.hidden)audioEl.pause();else audioEl.play();}});
})();
</script>
</body>
</html>
